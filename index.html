<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세종학당 한국어 2 종합문제 연습</title>
  <!-- Google Fonts: Pretendard alternative & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Chart.js CDN for interactive doughnut chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome for clean icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --primary-soft: rgba(79, 70, 229, 0.08);
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #475569;
      --text-muted: #94A3B8;
      --border-subtle: #E2E8F0;
      --correct: #059669;
      --correct-bg: #ECFDF5;
      --correct-border: #A7F3D0;
      --wrong: #E11D48;
      --wrong-bg: #FFF1F2;
      --wrong-border: #FECDD3;
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 14px -2px rgb(0 0 0 / 0.08);
      --shadow-lg: 0 12px 28px -4px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 36px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    /* Top Navigation Header */
    .app-header {
      background: var(--surface);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      border: 1px solid var(--border-subtle);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .header-sub {
      font-size: 0.86rem;
      color: var(--text-sub);
      margin-top: 3px;
      font-weight: 500;
    }

    .back-btn {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: #F1F5F9;
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: #E2E8F0;
      color: var(--text-main);
    }

    /* Unit Selection Cards */
    .unit-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .unit-card {
      background: var(--surface);
      border: 1.5px solid var(--border-subtle);
      border-radius: 18px;
      padding: 20px 22px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .unit-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .unit-tag {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 3px;
    }

    .unit-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .unit-desc {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .unit-arrow-pill {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .unit-card:hover .unit-arrow-pill {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Quiz Stage Container */
    .quiz-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-subtle);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: #E2E8F0;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366F1, #4F46E5);
      border-radius: 9999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .instruction-banner {
      font-size: 0.86rem;
      line-height: 1.5;
      color: #334155;
      background: #F8FAFC;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      border-left: 4px solid var(--primary);
      font-weight: 600;
    }

    .quiz-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-step-badge {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .question-box {
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      padding: 20px 18px;
      margin-bottom: 20px;
      font-size: 1.15rem;
      line-height: 1.75;
      font-weight: 700;
      color: #0F172A;
      white-space: pre-line;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    /* Option Items */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1.02rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.selected-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #065F46 !important;
      font-weight: 800;
    }

    .option-btn.selected-wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #991B1B !important;
      font-weight: 800;
    }

    .option-btn.reveal-correct {
      border-color: var(--correct) !important;
      background-color: var(--correct-bg) !important;
      color: #065F46 !important;
      font-weight: 800;
    }

    /* Feedback Banner */
    .feedback-banner {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      display: none;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .feedback-banner.correct {
      background-color: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: #065F46;
    }

    .feedback-banner.wrong {
      background-color: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
      color: #991B1B;
    }

    .feedback-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feedback-desc {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .continue-btn {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .continue-btn:hover {
      background-color: var(--primary-hover);
    }

    .continue-btn:active {
      transform: scale(0.99);
    }

    /* Result Stage */
    .result-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-subtle);
    }

    .result-badge {
      font-size: 0.82rem;
      font-weight: 800;
      background: var(--primary-light);
      color: var(--primary);
      padding: 5px 14px;
      border-radius: 9999px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .result-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .chart-box {
      position: relative;
      width: 190px;
      height: 190px;
      margin: 20px auto;
    }

    .stat-pills {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-pill {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      flex: 1;
    }

    .stat-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .stat-num {
      font-size: 1.25rem;
      font-weight: 900;
    }

    .stat-num.green { color: var(--correct); }
    .stat-num.red { color: var(--wrong); }

    .result-action-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-act {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary-action {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary-action:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary-action {
      background-color: var(--bg);
      color: var(--text-main);
      border: 1.5px solid var(--border-subtle);
    }

    .btn-secondary-action:hover {
      background-color: #E2E8F0;
    }

    .hidden {
      display: none !important;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <header class="app-header">
      <button id="backBtn" class="back-btn hidden" onclick="goHome()">
        <i class="fa-solid fa-arrow-left"></i> 단원 선택
      </button>
      <div class="header-badge" id="headerTag">
        <i class="fa-solid fa-book-open"></i> 세종학당 한국어 2
      </div>
      <h1 class="header-title" id="appTitle">종합문제 연습</h1>
      <p class="header-sub" id="appSubTitle">풀이할 단원을 선택해 주세요</p>
    </header>

    <!-- Screen 1: Unit Selector -->
    <section id="unitScreen" class="unit-list">
      <div class="unit-card" onclick="startUnit('unit1_5')">
        <div>
          <div class="unit-tag"><i class="fa-solid fa-layer-group"></i> Part 03</div>
          <div class="unit-title">초급 2 · 1과~5과</div>
          <div class="unit-desc">총 20문제 (어휘, 문법, 종합 이해)</div>
        </div>
        <div class="unit-arrow-pill"><i class="fa-solid fa-chevron-right"></i></div>
      </div>
      <div class="unit-card" onclick="startUnit('unit6_10')">
        <div>
          <div class="unit-tag"><i class="fa-solid fa-layer-group"></i> Part 03</div>
          <div class="unit-title">초급 2 · 6과~10과</div>
          <div class="unit-desc">총 20문제 (어휘, 문법, 종합 이해)</div>
        </div>
        <div class="unit-arrow-pill"><i class="fa-solid fa-chevron-right"></i></div>
      </div>
      <div class="unit-card" onclick="startUnit('unit11_15')">
        <div>
          <div class="unit-tag"><i class="fa-solid fa-layer-group"></i> Part 03</div>
          <div class="unit-title">초급 2 · 11과~15과</div>
          <div class="unit-desc">총 20문제 (어휘, 문법, 종합 이해)</div>
        </div>
        <div class="unit-arrow-pill"><i class="fa-solid fa-chevron-right"></i></div>
      </div>
      <div class="unit-card" onclick="startUnit('unit16_20')">
        <div>
          <div class="unit-tag"><i class="fa-solid fa-layer-group"></i> Part 03</div>
          <div class="unit-title">초급 2 · 16과~20과</div>
          <div class="unit-desc">총 20문제 (어휘, 문법, 종합 이해)</div>
        </div>
        <div class="unit-arrow-pill"><i class="fa-solid fa-chevron-right"></i></div>
      </div>
    </section>

    <!-- Screen 2: Quiz Stage -->
    <main id="quizScreen" class="hidden">
      <div class="quiz-card">
        <div class="progress-track">
          <div id="progressBar" class="progress-fill"></div>
        </div>

        <div id="instructionText" class="instruction-banner"></div>
        
        <div class="quiz-info-row">
          <span id="questionStepBadge" class="q-step-badge"></span>
        </div>

        <div id="questionText" class="question-box"></div>
        <div id="optionsContainer" class="options-grid"></div>

        <div id="feedbackBox" class="feedback-banner">
          <div id="feedbackTitle" class="feedback-title"></div>
          <div id="feedbackDesc" class="feedback-desc"></div>
        </div>

        <button id="nextBtn" class="continue-btn" onclick="nextQuestion()">다음 문제 <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </main>

    <!-- Screen 3: Result Report Screen -->
    <section id="resultScreen" class="hidden">
      <div class="result-card">
        <span class="result-badge"><i class="fa-solid fa-circle-check"></i> 학습 완료</span>
        <h2 class="result-title" id="resultRateText">정답률 100%</h2>
        
        <div class="chart-box">
          <canvas id="resultChart"></canvas>
        </div>

        <div class="stat-pills">
          <div class="stat-pill">
            <div class="stat-label">정답</div>
            <div class="stat-num green" id="statCorrectCount">0</div>
          </div>
          <div class="stat-pill">
            <div class="stat-label">오답</div>
            <div class="stat-num red" id="statWrongCount">0</div>
          </div>
          <div class="stat-pill">
            <div class="stat-label">전체 문항</div>
            <div class="stat-num" id="statTotalCount">20</div>
          </div>
        </div>

        <div class="result-action-group">
          <button id="retryWrongBtn" class="btn-act btn-primary-action" onclick="retryWrong()">
            <i class="fa-solid fa-rotate-left"></i> 오답 다시 풀기
          </button>
          <button class="btn-act btn-secondary-action" onclick="retryAll()">
            <i class="fa-solid fa-arrows-rotate"></i> 전체 다시 풀기
          </button>
          <button class="btn-act btn-secondary-action" style="background:#F1F5F9;" onclick="goHome()">
            <i class="fa-solid fa-list"></i> 다른 단원 선택하기
          </button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const quizDatabase = {
      unit1_5: {
        title: "초급 2 · 1과~5과",
        questions: [
          { id: 1, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.\nChoose the correct answer to fill in the blank. Use <Example> as a reference.", text: "비가 많이 오고 바람도 부네요. _________이/가 오고 있어요.", options: ["① 안개", "② 태풍", "③ 구름", "④ 햇빛"], ans: 2 },
          { id: 2, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.\nChoose the correct answer to fill in the blank. Use <Example> as a reference.", text: "고추장을 많이 _________ 매워요.", options: ["① 넣어서", "② 할인해서", "③ 주문해서", "④ 만들어서"], ans: 1 },
          { id: 3, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.\nChoose the correct answer to fill in the blank. Use <Example> as a reference.", text: "쯔엉 씨가 못 오니까 음식 하나를 _________?", options: ["① 예약할까요", "② 쇼핑할까요", "③ 계산할까요", "④ 취소할까요"], ans: 4 },
          { id: 4, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.\nChoose the correct answer to fill in the blank. Use <Example> as a reference.", text: "낮에는 따뜻하지만 밤에는 _________ 감기 조심하세요.", options: ["① 강하니까", "② 높으니까", "③ 쌀쌀하니까", "④ 안개가 끼니까"], ans: 3 },
          { id: 5, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.\nChoose the correct answer to fill in the blank. Use <Example> as a reference.", text: "반찬을 _________에 담아서 드세요.", options: ["① 국", "② 식탁", "③ 접시", "④ 젓가락"], ans: 3 },
          { id: 6, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.\nChoose the correct answer to fill in the blank. Use <Example> as a reference.", text: "음료수 2병을 사니까 1병을 _________으로/로 주었어요.", options: ["① 양념", "② 마트", "③ 재료", "④ 공짜"], ans: 4 },
          { id: 7, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.\nChoose the correct answer to fill in the blank. Use <Example> as a reference.", text: "청소를 좀 하세요. 방이 너무 _________.", options: ["① 밝아요", "② 더러워요", "③ 깨끗해요", "④ 시끄러워요"], ans: 2 },
          { id: 8, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.\nChoose the correct answer to fill in the blank. Use <Example> as a reference.", text: "길이 너무 _________ 찾아오는 것이 힘들었어요.", options: ["① 좋아서", "② 피곤해서", "③ 가까워서", "④ 복잡해서"], ans: 4 },

    // State Variables
    let currentUnitKey = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let wrongAnswers = [];
    let correctCount = 0;
    let myChart = null;

    // View Navigation Logic
    function goHome() {
      document.getElementById('unitScreen').classList.remove('hidden');
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('headerTag').innerHTML = '<i class="fa-solid fa-book-open"></i> 세종학당 한국어 2';
      document.getElementById('appTitle').innerText = '종합문제 연습';
      document.getElementById('appSubTitle').innerText = '풀이할 단원을 선택해 주세요';
    }

    function startUnit(unitKey) {
      currentUnitKey = unitKey;
      const unit = quizDatabase[unitKey];
      currentQuestions = [...unit.questions];
      currentIndex = 0;
      wrongAnswers = [];
      correctCount = 0;

      document.getElementById('unitScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('headerTag').innerHTML = '<i class="fa-solid fa-layer-group"></i> Part 03';
      document.getElementById('appTitle').innerText = unit.title;
      document.getElementById('appSubTitle').innerText = `총 ${currentQuestions.length}문항`;

      renderQuestion();
    }

    // Question Rendering and Option Handling
    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;

      document.getElementById('progressBar').style.width = `${((currentIndex) / total) * 100}%`;
      document.getElementById('questionStepBadge').innerText = `문항 ${currentIndex + 1} / ${total}`;
      document.getElementById('instructionText').innerText = q.inst;
      document.getElementById('questionText').innerText = `${q.id}. ${q.text}`;

      const optsContainer = document.getElementById('optionsContainer');
      optsContainer.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${optText}</span><span class="status-icon"></span>`;
        btn.onclick = () => selectOption(idx + 1);
        optsContainer.appendChild(btn);
      });

      document.getElementById('feedbackBox').style.display = 'none';
      document.getElementById('feedbackBox').className = 'feedback-banner';
      document.getElementById('nextBtn').style.display = 'none';
    }

    function selectOption(selectedAns) {
      const q = currentQuestions[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);

      const isCorrect = (selectedAns === q.ans);
      const feedbackBox = document.getElementById('feedbackBox');
      const feedbackTitle = document.getElementById('feedbackTitle');
      const feedbackDesc = document.getElementById('feedbackDesc');

      if (isCorrect) {
        correctCount++;
        buttons[selectedAns - 1].classList.add('selected-correct');
        buttons[selectedAns - 1].querySelector('.status-icon').innerHTML = '<i class="fa-solid fa-circle-check"></i>';
        feedbackBox.className = 'feedback-banner correct';
        feedbackTitle.innerHTML = '<i class="fa-solid fa-circle-check"></i> 정답입니다!';
        feedbackDesc.innerText = '참 잘했습니다.';
      } else {
        wrongAnswers.push(q);
        buttons[selectedAns - 1].classList.add('selected-wrong');
        buttons[selectedAns - 1].querySelector('.status-icon').innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
        buttons[q.ans - 1].classList.add('reveal-correct');
        buttons[q.ans - 1].querySelector('.status-icon').innerHTML = '<i class="fa-solid fa-circle-check"></i>';
        feedbackBox.className = 'feedback-banner wrong';
        feedbackTitle.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> 오답입니다.';
        feedbackDesc.innerText = `정답은 "${q.options[q.ans - 1]}" 입니다.`;
      }

      feedbackBox.style.display = 'block';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'flex';
      if (currentIndex === currentQuestions.length - 1) {
        nextBtn.innerHTML = '결과 확인하기 <i class="fa-solid fa-award"></i>';
      } else {
        nextBtn.innerHTML = '다음 문제 <i class="fa-solid fa-arrow-right"></i>';
      }
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    // Chart.js Result Dashboard Logic
    function showResults() {
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      const total = currentQuestions.length;
      const wrongCount = total - correctCount;
      const percentage = Math.round((correctCount / total) * 100);

      document.getElementById('resultRateText').innerText = `정답률 ${percentage}% (${correctCount}/${total})`;
      document.getElementById('statCorrectCount').innerText = correctCount;
      document.getElementById('statWrongCount').innerText = wrongCount;
      document.getElementById('statTotalCount').innerText = total;

      const retryWrongBtn = document.getElementById('retryWrongBtn');
      if (wrongCount === 0) {
        retryWrongBtn.style.display = 'none';
      } else {
        retryWrongBtn.style.display = 'flex';
      }

      renderChart(correctCount, wrongCount);
    }

    function renderChart(correct, wrong) {
      const ctx = document.getElementById('resultChart').getContext('2d');
      if (myChart) {
        myChart.destroy();
      }

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['정답', '오답'],
          datasets: [{
            data: [correct, wrong],
            backgroundColor: ['#059669', '#E11D48'],
            hoverBackgroundColor: ['#047857', '#BE123C'],
            borderWidth: 3,
            borderColor: '#FFFFFF'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                boxWidth: 10,
                font: { size: 12, weight: '700' },
                padding: 14
              }
            }
          },
          cutout: '72%'
        }
      });
    }

    function retryAll() {
      startUnit(currentUnitKey);
    }

    function retryWrong() {
      if (wrongAnswers.length === 0) return;
      currentQuestions = [...wrongAnswers];
      currentIndex = 0;
      wrongAnswers = [];
      correctCount = 0;

      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      document.getElementById('appSubTitle').innerText = `오답 복습 (${currentQuestions.length}문항)`;

      renderQuestion();
    }
