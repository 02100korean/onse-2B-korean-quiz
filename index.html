    // Number symbols ①, ②, ③, ④
    const numberSymbols = ["①", "②", "③", "④"];

    function initQuiz(questionsList, modeLabel = "전체 문제") {
      currentQuizQueue = [...questionsList];
      currentIndex = 0;
      correctCount = 0;
      wrongCount = 0;
      incorrectQuestionsList = [];
      isAnswered = false;

      document.getElementById('mode-badge').innerText = modeLabel;
      document.getElementById('correct-count-live').innerText = '0';
      document.getElementById('wrong-count-live').innerText = '0';

      document.getElementById('result-container').classList.add('hidden');
      document.getElementById('quiz-container').classList.remove('hidden');

      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      if (currentIndex >= currentQuizQueue.length) {
        showResults();
        return;
      }

      isAnswered = false;
      const q = currentQuizQueue[currentIndex];

      // Update counters & progress bar
      document.getElementById('progress-text').innerText = `문제 ${currentIndex + 1} / ${currentQuizQueue.length}`;
      const progressPercent = ((currentIndex) / currentQuizQueue.length) * 100;
      document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;

      // Section information
      document.getElementById('section-title').innerText = q.sectionTitle;
      document.getElementById('section-desc').innerText = q.sectionDesc;

      // Question Number & Content
      document.getElementById('question-number-badge').innerText = q.num;
      document.getElementById('question-text').innerHTML = q.promptHtml;

      // Reset Feedback
      const feedbackBox = document.getElementById('feedback-box');
      feedbackBox.classList.add('hidden');

      // Populate Options
      const optionsContainer = document.getElementById('options-list');
      optionsContainer.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const optionNumber = idx + 1;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.id = `option-btn-${optionNumber}`;
        btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-400 hover:bg-slate-50 transition flex items-center justify-between text-slate-800 font-medium group focus:outline-none";
        btn.onclick = () => handleSelectOption(optionNumber);

        btn.innerHTML = `
          <div class="flex items-center space-x-3.5">
            <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-100 group-hover:bg-indigo-100 group-hover:text-indigo-700 text-slate-600 font-bold text-sm transition">
              ${numberSymbols[idx]}
            </span>
            <span class="text-base text-slate-800">${optText}</span>
          </div>
          <span class="status-indicator text-lg"></span>
        `;
        optionsContainer.appendChild(btn);
      });
    }

    function handleSelectOption(selectedChoice) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuizQueue[currentIndex];
      const isCorrect = (selectedChoice === q.answer);

      // Disable all option buttons and apply colors
      for (let i = 1; i <= q.options.length; i++) {
        const btn = document.getElementById(`option-btn-${i}`);
        btn.disabled = true;
        btn.classList.remove('hover:border-indigo-400', 'hover:bg-slate-50');

        const indicator = btn.querySelector('.status-indicator');

        if (i === q.answer) {
          // Correct answer style (Green)
          btn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50/80 transition flex items-center justify-between text-slate-900 font-semibold";
          indicator.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i>';
        } else if (i === selectedChoice && !isCorrect) {
          // Selected wrong answer style (Red)
          btn.className = "w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50/80 transition flex items-center justify-between text-slate-900 font-semibold";
          indicator.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-500"></i>';
        } else {
          // Other unselected options dimmed
          btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-white opacity-40 transition flex items-center justify-between text-slate-600";
        }
      }

      // Update counters
      if (isCorrect) {
        correctCount++;
        document.getElementById('correct-count-live').innerText = correctCount;
      } else {
        wrongCount++;
        document.getElementById('wrong-count-live').innerText = wrongCount;
        incorrectQuestionsList.push(q);
      }

      // Show Feedback box
      const feedbackBox = document.getElementById('feedback-box');
      const feedbackAlert = document.getElementById('feedback-alert');
      const feedbackIcon = document.getElementById('feedback-icon');
      const feedbackTitle = document.getElementById('feedback-title');
      const feedbackDesc = document.getElementById('feedback-desc');
      const nextBtn = document.getElementById('next-btn');

      if (isCorrect) {
        feedbackAlert.className = "p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 flex items-center justify-between";
        feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i>';
        feedbackTitle.innerText = "정답입니다!";
        feedbackDesc.innerText = `정답: ${numberSymbols[q.answer - 1]} ${q.options[q.answer - 1]}`;
        nextBtn.className = "shrink-0 ml-3 px-5 py-2.5 rounded-xl font-bold text-sm text-white bg-emerald-600 hover:bg-emerald-700 shadow-sm transition flex items-center space-x-1.5";
      } else {
        feedbackAlert.className = "p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 flex items-center justify-between";
        feedbackIcon.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600"></i>';
        feedbackTitle.innerText = "오답입니다.";
        feedbackDesc.innerText = `정답은 ${numberSymbols[q.answer - 1]} ${q.options[q.answer - 1]} 입니다.`;
        nextBtn.className = "shrink-0 ml-3 px-5 py-2.5 rounded-xl font-bold text-sm text-white bg-rose-600 hover:bg-rose-700 shadow-sm transition flex items-center space-x-1.5";
      }

      feedbackBox.classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuizQueue.length) {
        renderCurrentQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-container').classList.add('hidden');
      document.getElementById('result-container').classList.remove('hidden');

      const total = currentQuizQueue.length;
      const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-correct').innerText = correctCount;
      document.getElementById('stat-wrong').innerText = wrongCount;
      document.getElementById('chart-accuracy').innerText = `${accuracy}%`;

      // Configure retry incorrect button state
      const retryWrongBtn = document.getElementById('btn-retry-wrong');
      if (wrongCount === 0) {
        retryWrongBtn.disabled = true;
        retryWrongBtn.title = "틀린 문제가 없습니다!";
      } else {
        retryWrongBtn.disabled = false;
        retryWrongBtn.title = "";
      }

      // Draw / Re-render Chart.js Pie Chart
      const ctx = document.getElementById('resultChart').getContext('2d');
      if (pieChartInstance) {
        pieChartInstance.destroy();
      }

      pieChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['정답', '오답'],
          datasets: [{
            data: [correctCount, wrongCount],
            backgroundColor: ['#10b981', '#f43f5e'],
            hoverBackgroundColor: ['#059669', '#e11d48'],
            borderWidth: 2,
            borderColor: '#ffffff',
            cutout: '72%'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const label = context.label || '';
                  const value = context.parsed || 0;
                  const pct = total > 0 ? Math.round((value / total) * 100) : 0;
                  return ` ${label}: ${value}문제 (${pct}%)`;
                }
              }
            }
          },
          animation: {
            animateScale: true,
            animateRotate: true,
            duration: 800
          }
        }
      });
    }

    function restartAll() {
      initQuiz(ALL_QUESTIONS, "전체 문제");
    }

    function retryIncorrect() {
      if (incorrectQuestionsList.length === 0) return;
      initQuiz(incorrectQuestionsList, `오답 다시 풀기 (${incorrectQuestionsList.length}문제)`);
    }

    // Start immediately on window load
    window.addEventListener('DOMContentLoaded', () => {
      initQuiz(ALL_QUESTIONS, "전체 문제");
    });
  </script>
</body>
</html>
