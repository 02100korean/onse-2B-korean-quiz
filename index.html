<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세종학당 한국어 2 종합문제 연습</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --correct: #10B981;
      --correct-bg: #ECFDF5;
      --wrong: #EF4444;
      --wrong-bg: #FEF2F2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
      border: 1px solid var(--border);
      text-align: center;
      position: relative;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .header-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .home-btn {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: #F1F5F9;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .home-btn:hover {
      background: #E2E8F0;
      color: var(--text);
    }

    /* Unit Selection Screen */
    .unit-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .unit-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .unit-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1);
    }

    .unit-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .unit-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .unit-arrow {
      font-size: 1.5rem;
      color: var(--primary);
      font-weight: bold;
    }

    /* Quiz Screen */
    .quiz-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: #E2E8F0;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      transition: width 0.3s ease;
      width: 0%;
    }

    .question-instruction {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
      background: #F8FAFC;
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .question-number {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .question-text {
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 500;
      margin-bottom: 24px;
      white-space: pre-line;
      color: #0F172A;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #F8FAFC;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: 1.05rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
    }

    .option-btn:hover:not(:disabled) {
      background: #EEF2FF;
      border-color: var(--primary);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.selected-correct {
      background-color: var(--correct-bg);
      border-color: var(--correct);
      color: #065F46;
      font-weight: 600;
    }

    .option-btn.selected-wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong);
      color: #991B1B;
      font-weight: 600;
    }

    .option-btn.reveal-correct {
      border-color: var(--correct);
      background-color: var(--correct-bg);
      color: #065F46;
    }

    .feedback-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback-box.correct {
      background-color: var(--correct-bg);
      border: 1px solid var(--correct);
      color: #065F46;
    }

    .feedback-box.wrong {
      background-color: var(--wrong-bg);
      border: 1px solid var(--wrong);
      color: #991B1B;
    }

    .feedback-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feedback-desc {
      font-size: 0.95rem;
    }

    .next-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .next-btn:hover {
      background-color: var(--primary-hover);
    }

    /* Result Screen */
    .result-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .chart-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 20px auto;
    }

    .score-summary {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .score-details {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .action-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-retry-all {
      background-color: var(--primary);
      color: white;
    }

    .btn-retry-all:hover {
      background-color: var(--primary-hover);
    }

    .btn-retry-wrong {
      background-color: #F1F5F9;
      color: var(--text);
    }

    .btn-retry-wrong:hover {
      background-color: #E2E8F0;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header-card">
      <button id="homeBtn" class="home-btn hidden" onclick="goHome()">← 단원 선택</button>
      <div class="header-title" id="appTitle">세종학당 한국어 2 종합문제</div>
      <div class="header-sub" id="appSubTitle">초급 2 연습 문제</div>
    </div>

    <!-- 1. Unit Select Screen -->
    <div id="unitScreen" class="unit-grid">
      <div class="unit-card" onclick="startUnit('unit1_5')">
        <div>
          <div class="unit-card-title">Part 03 : 초급2 · 1과~5과</div>
          <div class="unit-card-desc">총 20문제 (어휘, 문법, 종합 이해)</div>
        </div>
        <div class="unit-arrow">›</div>
      </div>
      <div class="unit-card" onclick="startUnit('unit6_10')">
        <div>
          <div class="unit-card-title">Part 03 : 초급2 · 6과~10과</div>
          <div class="unit-card-desc">총 20문제 (어휘, 문법, 종합 이해)</div>
        </div>
        <div class="unit-arrow">›</div>
      </div>
      <div class="unit-card" onclick="startUnit('unit11_15')">
        <div>
          <div class="unit-card-title">Part 03 : 초급2 · 11과~15과</div>
          <div class="unit-card-desc">총 20문제 (어휘, 문법, 종합 이해)</div>
        </div>
        <div class="unit-arrow">›</div>
      </div>
      <div class="unit-card" onclick="startUnit('unit16_20')">
        <div>
          <div class="unit-card-title">Part 03 : 초급2 · 16과~20과</div>
          <div class="unit-card-desc">총 20문제 (어휘, 문법, 종합 이해)</div>
        </div>
        <div class="unit-arrow">›</div>
      </div>
    </div>

    <!-- 2. Quiz Screen -->
    <div id="quizScreen" class="hidden">
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="quiz-card">
        <div id="instructionText" class="question-instruction"></div>
        <div class="question-header">
          <span id="questionNumber" class="question-number"></span>
        </div>
        <div id="questionText" class="question-text"></div>
        <div id="optionsContainer" class="options-list"></div>

        <div id="feedbackBox" class="feedback-box">
          <div id="feedbackTitle" class="feedback-title"></div>
          <div id="feedbackDesc" class="feedback-desc"></div>
        </div>

        <button id="nextBtn" class="next-btn" onclick="nextQuestion()">다음 문제</button>
      </div>
    </div>

    <!-- 3. Result Screen -->
    <div id="resultScreen" class="hidden">
      <div class="result-card">
        <div class="score-summary" id="resultSummary">학습 완료!</div>
        <div class="chart-container">
          <canvas id="resultChart"></canvas>
        </div>
        <div class="score-details" id="resultScoreText"></div>

        <div class="action-btn-group">
          <button id="retryWrongBtn" class="action-btn btn-retry-wrong" onclick="retryWrong()">오답 다시 풀기</button>
          <button class="action-btn btn-retry-all" onclick="retryAll()">다시 풀기</button>
          <button class="action-btn" style="background:#E2E8F0; color:#334155; margin-top:4px;" onclick="goHome()">다른 단원 선택하기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Database of questions exactly as in the textbook
    const quizDatabase = {
      unit1_5: {
        title: "Part 03 : 초급2 · 1과~5과",
        questions: [
          { id: 1, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "비가 많이 오고 바람도 부네요. _________이/가 오고 있어요.", options: ["① 안개", "② 태풍", "③ 구름", "④ 햇빛"], ans: 2 },
          { id: 2, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "고추장을 많이 _________ 매워요.", options: ["① 넣어서", "② 할인해서", "③ 주문해서", "④ 만들어서"], ans: 1 },
          { id: 3, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "쯔엉 씨가 못 오니까 음식 하나를 _________?", options: ["① 예약할까요", "② 쇼핑할까요", "③ 계산할까요", "④ 취소할까요"], ans: 4 },
          { id: 4, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "낮에는 따뜻하지만 밤에는 _________ 감기 조심하세요.", options: ["① 강하니까", "② 높으니까", "③ 쌀쌀하니까", "④ 안개가 끼니까"], ans: 3 },
          { id: 5, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "반찬을 _________에 담아서 드세요.", options: ["① 국", "② 식탁", "③ 접시", "④ 젓가락"], ans: 3 },
          { id: 6, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "음료수 2병을 사니까 1병을 _________으로/로 주었어요.", options: ["① 양념", "② 마트", "③ 재료", "④ 공짜"], ans: 4 },

          { id: 8, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "길이 너무 _________ 찾아오는 것이 힘들었어요.", options: ["① 좋아서", "② 피곤해서", "③ 가까워서", "④ 복잡해서"], ans: 4 },
          { id: 9, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "제 친구는 예전에는 머리가 길었는데 지금은 _________.", options: ["① 커요", "② 작아요", "③ 짧아요", "④ 많아요"], ans: 3 },

          { id: 11, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 어젯밤에 시끄러워서 잠을 못 잤어요.\n나: 많이 _________.", options: ["① 피곤합시다", "② 피곤할까요", "③ 피곤하겠어요", "④ 피곤하지 않아요"], ans: 3 },
          { id: 12, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 축구를 좋아해요?\n나: 축구 _________ 안 좋아하지만 보는 것은 좋아해요.", options: ["① 하는데", "② 하려고", "③ 하는 것은", "④ 하기 전에"], ans: 3 },

          { id: 18, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 어머니_________ 자주 전화를 해요?\n나: 아니요, 바빠서 자주 전화를 못해요.", options: ["① 께", "② 께서", "③ 밖에", "④ 한테서"], ans: 1 },
          { id: 19, inst: "[19~20] 무엇에 대한 이야기예요? <보기>와 같이 알맞은 것을 고르세요.", text: "삼만원 받았습니다. 영수증 드릴까요?", options: ["① 계산", "② 취소", "③ 선물", "④ 장소"], ans: 1 },
          { id: 20, inst: "[19~20] 무엇에 대한 이야기예요? <보기>와 같이 알맞은 것을 고르세요.", text: "마트에서 소고기하고 돼지고기를 사요. 야채도 사요.", options: ["① 양념", "② 할인", "③ 식기", "④ 식재료"], ans: 4 }

        title: "Part 03 : 초급2 · 6과~10과",

          { id: 1, inst: "[1~10] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "감기에 걸려서 _________을/를 해요.", options: ["① 기침", "② 두통", "③ 콧물", "④ 배탈"], ans: 1 },

          { id: 12, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 이거 한번 _________?\n나: 물론이죠. 입어 보세요.", options: ["① 입어 볼 거예요", "② 입어 봐도 돼요", "③ 입어 보고 싶어요", "④ 입어 보려고 해요"], ans: 2 },
          { id: 13, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "저는 시간이 _________ 영화를 봐요.", options: ["① 있거나", "② 있다가", "③ 있지만", "④ 있을 때"], ans: 4 },
          { id: 14, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 왜 한국어를 공부했어요?\n나: 한국 드라마를 좋아해서 한국어를 _________.", options: ["① 공부할 거예요", "② 공부해도 돼요", "③ 공부해야 해요", "④ 공부하게 됐어요"], ans: 4 },
          { id: 15, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 바이올린을 아주 잘 켜네요. 바이올린을 _________ 얼마나 됐어요?\n나: 5년 정도 됐어요.", options: ["① 배우면", "② 배우는", "③ 배운 지", "④ 배울 때"], ans: 3 },
          { id: 16, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 수아 돌잔치에 뭘 가져 갈까요?\n나: 그냥 오시면 돼요. 필요한 건 다 _________.", options: ["① 준비되었군요", "② 준비해 주세요", "③ 준비되어 있어요", "④ 준비하고 싶어요"], ans: 3 },
          { id: 17, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 이번 주말에 뭐 할 거예요?\n나: 저는 집에서 _________ 친구를 만나려고 해요.", options: ["① 쉰 지", "② 쉬거나", "③ 쉬려고", "④ 쉬지만"], ans: 2 },
          { id: 18, inst: "[11~18] <보기>와 같이 빈칸에 들어갈 가장 알맞은 것을 고르세요.", text: "가: 지훈 씨, 지금 원룸에서 살고 있지요? 어때요?\n나: 혼자 살기 때문에 조금 외로워요. 다음 학기에는 기숙사에서 _________.", options: ["① 살까 봐요", "② 살고 있어요", "③ 살아 봤어요", "④ 살아도 돼요"], ans: 1 },
          { id: 19, inst: "[19~20] 무엇에 대한 이야기예요? <보기>와 같이 알맞은 것을 고르세요.", text: "이사한 집에 친구들을 초대해서 하는 파티예요.", options: ["① 공연", "② 계획", "③ 집들이", "④ 가족 모임"], ans: 3 },
          { id: 20, inst: "[19~20] 무엇에 대한 이야기예요? <보기>와 같이 알맞은 것을 고르세요.", text: "아이의 첫 번째 생일이에요. 사람들이 모여서 축하해요.", options: ["① 소풍", "② 여행", "③ 돌잔치", "④ 결혼식"], ans: 3 }
        ]
      }
    };

    let currentUnitKey = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let wrongAnswers = [];
    let correctCount = 0;
    let myChart = null;

    function goHome() {
      document.getElementById('unitScreen').classList.remove('hidden');
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('homeBtn').classList.add('hidden');
      document.getElementById('appTitle').innerText = '세종학당 한국어 2 종합문제';
      document.getElementById('appSubTitle').innerText = '초급 2 연습 문제';
    }

    function startUnit(unitKey) {
      currentUnitKey = unitKey;
      const unit = quizDatabase[unitKey];
      currentQuestions = [...unit.questions];
      currentIndex = 0;
      wrongAnswers = [];
      correctCount = 0;

      document.getElementById('unitScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('homeBtn').classList.remove('hidden');
      document.getElementById('appTitle').innerText = unit.title;
      document.getElementById('appSubTitle').innerText = `총 ${currentQuestions.length}문제`;

      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;

      document.getElementById('progressBar').style.width = `${((currentIndex) / total) * 100}%`;
      document.getElementById('questionNumber').innerText = `문제 ${currentIndex + 1} / ${total}`;
      document.getElementById('instructionText').innerText = q.inst;
      document.getElementById('questionText').innerText = `${q.id}. ${q.text}`;

      const optsContainer = document.getElementById('optionsContainer');
      optsContainer.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.onclick = () => selectOption(idx + 1);
        optsContainer.appendChild(btn);
      });

      document.getElementById('feedbackBox').style.display = 'none';
      document.getElementById('feedbackBox').className = 'feedback-box';
      document.getElementById('nextBtn').style.display = 'none';
    }

    function selectOption(selectedAns) {
      const q = currentQuestions[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach(btn => btn.disabled = true);

      const isCorrect = (selectedAns === q.ans);
      const feedbackBox = document.getElementById('feedbackBox');
      const feedbackTitle = document.getElementById('feedbackTitle');
      const feedbackDesc = document.getElementById('feedbackDesc');

      if (isCorrect) {
        correctCount++;
        buttons[selectedAns - 1].classList.add('selected-correct');
        feedbackBox.className = 'feedback-box correct';
        feedbackTitle.innerHTML = '✓ 정답입니다!';
        feedbackDesc.innerText = '아주 잘하셨습니다.';
      } else {
        wrongAnswers.push(q);
        buttons[selectedAns - 1].classList.add('selected-wrong');
        buttons[q.ans - 1].classList.add('reveal-correct');
        feedbackBox.className = 'feedback-box wrong';
        feedbackTitle.innerHTML = '✕ 오답입니다.';
        feedbackDesc.innerText = `정답은 ${q.options[q.ans - 1]} 입니다.`;
      }

      feedbackBox.style.display = 'block';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'block';
      if (currentIndex === currentQuestions.length - 1) {
        nextBtn.innerText = '결과 확인하기';
      } else {
        nextBtn.innerText = '다음 문제';
      }
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      const total = currentQuestions.length;
      const wrongCount = total - correctCount;
      const percentage = Math.round((correctCount / total) * 100);

      document.getElementById('resultSummary').innerText = `${percentage}점 (${total}문제 중 ${correctCount}개 정답)`;
      document.getElementById('resultScoreText').innerText = `정답 ${correctCount}개  |  오답 ${wrongCount}개`;

      const retryWrongBtn = document.getElementById('retryWrongBtn');
      if (wrongCount === 0) {
        retryWrongBtn.style.display = 'none';
      } else {
        retryWrongBtn.style.display = 'block';
      }

      renderChart(correctCount, wrongCount);
    }

    function renderChart(correct, wrong) {
      const ctx = document.getElementById('resultChart').getContext('2d');
      if (myChart) {
        myChart.destroy();
      }

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['정답', '오답'],
          datasets: [{
            data: [correct, wrong],
            backgroundColor: ['#10B981', '#EF4444'],
            hoverOffset: 4,
            borderWidth: 2,
            borderColor: '#FFFFFF'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                boxWidth: 12,
                font: { size: 13 }
              }
            }
          },
          cutout: '70%'
        }
      });
    }

    function retryAll() {
      startUnit(currentUnitKey);
    }

    function retryWrong() {
      if (wrongAnswers.length === 0) return;
      currentQuestions = [...wrongAnswers];
      currentIndex = 0;
      wrongAnswers = [];
      correctCount = 0;

      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      document.getElementById('appSubTitle').innerText = `오답 다시 풀기 (${currentQuestions.length}문제)`;

      renderQuestion();
    }
  </script>
